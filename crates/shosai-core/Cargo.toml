[package]
name = "shosai-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-unbounded-document-admission = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
percent-encoding.workspace = true
pdfium-render = { version = "0.8", features = ["thread_safe", "sync", "image"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
zip = { version = "8.4.0", default-features = false, features = ["deflate"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
roxmltree = "0.21.1"
quick-xml = { version = "0.39.2", features = ["escape-html"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
cssparser = "0.33.0"
brotli-decompressor = "=5.0.3"
fontdb = "0.23.0"
cosmic-text = "=0.15.0"
wuff = { version = "=0.2.8", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["default-formats"] }
natord = "1.0.9"
unicode-casefold = "0.2.0"
unicode-bidi = "0.3.18"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.2"
sha2 = "0.10.9"
same-file = "1.0.6"
uuid = { version = "1.23.0", features = ["js", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }
