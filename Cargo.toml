[workspace]
members = [
    "crates/shosai-core",
    "crates/shosai-app",
    "crates/shosai-flutter-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chaba-dev/shosai"

[workspace.dependencies]
shosai-core = { path = "crates/shosai-core" }
anyhow = "1"
thiserror = "2"
bytes = "1"
percent-encoding = "2"

[profile.dev]
opt-level = 1
